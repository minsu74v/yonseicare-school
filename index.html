<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="application-name" content="원주연세 평가준비">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="원주연세 평가준비">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>원주연세재가복지센터 | 평가 면담 준비</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand">원주연세재가복지센터</div>
    <div class="title-row">
      <h1>평가 면담 준비</h1>
      <div class="counter" id="counter">32 중 1</div>
    </div>

    <div class="segment-bar" id="segmentBar" aria-label="문항 진행 상태"></div>

    <div class="state-counts" aria-label="문항 상태 요약">
      <div class="state-item unseen"><span class="dot"></span><span>아직 안 봄</span><strong id="unseenCount">32</strong></div>
      <div class="state-item known"><span class="dot known"></span><span>알겠어요</span><strong id="knownCount">0</strong></div>
      <div class="state-item review"><span class="dot review"></span><span>한 번 더 보기</span><strong id="reviewCount">0</strong></div>
    </div>
  </header>

  <main>
    <section class="intro-screen" id="introScreen">
      <div class="intro-card">
        <div class="intro-hello">안녕하세요, 선생님!</div>
        <div class="intro-text">
          공단 평가에서 나올 수 있는<br>
          <strong>예상 질문을 미리 연습해 보세요.</strong><br><br>
          어렵게 외우지 않으셔도 됩니다.<br>
          <strong>여러 번 반복하면 자연스럽게 익숙해집니다.</strong>
        </div>
        <div class="intro-center">원주연세재가복지센터</div>
      </div>
      <button class="start-btn" id="startBtn" type="button">학습 시작하기</button>
      <div class="copyright-note">© 원주연세재가복지센터. 본 학습자료의 무단 복제·배포 및 상업적 이용을 금합니다.</div>
    </section>

    <div id="studyScreen" style="display:none">
    <section class="question-card" id="questionCard">
      <div class="question-meta">
        <span class="question-number" id="qNo">문제 1</span>
        <span class="category" id="category"></span>
      </div>
      <h2 class="question" id="question"></h2>
    </section>

    <div class="flip-wrap" id="flipWrap">
      <div class="flip-card" id="flipCard">
        <button class="flip-face flip-front" id="showAnswer" type="button" aria-label="답 확인하기">
          <span class="answer-icon">↻</span>
          <span>답 확인하기</span>
        </button>

        <section class="flip-face flip-back answer-card" id="answerCard" aria-live="polite" role="button" tabindex="0" aria-label="답변 닫기">
          <div class="answer-label"><span class="answer-badge">A</span><span>답변</span></div>
          <div class="answer" id="answer"></div>
        </section>
      </div>
    </div>

    <div class="actions" id="actions">
      <button class="action known-btn" id="knownBtn">✓ 알겠어요</button>
      <button class="action review-btn" id="reviewBtn">↻ 한 번 더 볼래요</button>
    </div>

    <div class="status" id="status"></div>

    <section class="round-end" id="roundEnd">
      <div class="round-end-icon" id="roundEndIcon">↻</div>
      <div class="round-end-title" id="roundEndTitle"></div>
      <div class="round-end-text" id="roundEndText"></div>
      <button class="round-next-btn" id="roundNextBtn">다시 볼 문제로 가기</button>
      <button class="restart-btn" id="restartBtn" type="button">처음부터 다시 하기</button>
      <button class="kakao-share-btn" id="kakaoShareBtn" type="button">💬 담당 사회복지사에게 자랑하기</button>
    </section>

    <div class="nav" id="navArea">
      <button id="prevBtn">← 이전 문제</button>
      <button id="nextBtn">다음 문제 →</button>
    </div>

    <div class="tools">
      <button class="toolbtn font-tool" id="fontBtn"><span class="font-icon">가+</span><span id="fontLabel">글자 크게</span></button>
      <button class="toolbtn" id="resetBtn">진행기록 초기화</button>
    </div>
    </div>
  </main>
</div>

<script src="questions.js"></script>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.1/kakao.min.js"
  integrity="sha384-OL+ylM/iuPLtW5U3XcvLSGhE8JzReKDank5InqlHGWPhb4140/yrBw0bg0y7+C9J"
  crossorigin="anonymous"></script>
<script>
const STORAGE_KEY = "yonseicare-school-progress-v2";
const SESSION_KEY = "yonseicare-school-session-v2";
// 카카오톡 직접 공유를 사용하려면 카카오디벨로퍼스의 JavaScript 키를 아래 따옴표 안에 넣습니다.
const KAKAO_JAVASCRIPT_KEY = "790cd18dd70bbed027ce5d7f520217c2";
let states = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
let largeFont = false;

let session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
if (!session || !Array.isArray(session.queue) || session.queue.some(n => !QUESTIONS.some(q => q.number === n))) {
  session = {
    round: 1,
    queue: QUESTIONS.map(q => q.number),
    position: 0,
    ended: false
  };
}
if (session.position < 0 || session.position >= session.queue.length) session.position = 0;

const $ = (id) => document.getElementById(id);

function escapeHtml(text){
  return String(text).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[ch]));
}

function highlightText(text, words){
  if(!words || !words.length) return escapeHtml(text);
  const sorted = [...words].sort((a,b)=>b.length-a.length);
  const pattern = sorted.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  const re = new RegExp("(" + pattern + ")", "g");
  return escapeHtml(text).replace(re, '<span class="blue">$1</span>');
}

function currentQuestion(){
  const number = session.queue[session.position];
  return QUESTIONS.find(q => q.number === number);
}

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(states));
  localStorage.setItem(SESSION_KEY, JSON.stringify(session));
}

function renderSegments(){
  const bar = $("segmentBar");
  bar.innerHTML = "";
  bar.style.gridTemplateColumns = `repeat(${QUESTIONS.length}, 1fr)`;
  const currentNo = session.ended ? null : currentQuestion().number;
  QUESTIONS.forEach(q => {
    const s = document.createElement("div");
    s.className = "segment";
    if(states[q.number] === "known") s.classList.add("known");
    if(states[q.number] === "review") s.classList.add("review");
    if(q.number === currentNo) s.classList.add("current");
    bar.appendChild(s);
  });
}

function renderCounts(){
  const known = QUESTIONS.filter(q => states[q.number] === "known").length;
  const review = QUESTIONS.filter(q => states[q.number] === "review").length;
  const unseen = QUESTIONS.length - known - review;
  $("knownCount").textContent = known;
  $("reviewCount").textContent = review;
  $("unseenCount").textContent = unseen;
}

function hideRoundEnd(){
  $("roundEnd").classList.remove("show", "complete");
  $("questionCard").style.display = "block";
  $("navArea").style.display = "grid";
  $("flipWrap").style.display = "block";
  $("actions").style.display = "";
  $("status").style.display = "";
}

function renderQuestion(){
  session.ended = false;
  $("questionCard").style.display = "block";
  const q = currentQuestion();

  $("counter").textContent = session.round === 1
    ? `${QUESTIONS.length} 중 ${session.position + 1}`
    : `다시보기 ${session.position + 1} / ${session.queue.length}`;
  $("qNo").textContent = `문제 ${q.number}`;
  $("category").textContent = q.category;
  $("question").innerHTML = highlightText(q.question, q.qHighlights);
  $("answer").innerHTML = highlightText(q.answer, q.highlights);

  $("flipCard").classList.remove("flipped");
  $("flipCard").style.height = "152px";
  $("actions").classList.remove("show");
  $("actions").style.display = "";
  $("status").className = "status";
  $("status").style.display = "none";
  $("flipWrap").style.display = "block";
  $("navArea").style.display = "grid";

  $("prevBtn").disabled = session.position === 0;
  $("nextBtn").disabled = session.position === session.queue.length - 1;

  if(states[q.number]){
    const st = states[q.number];
    $("status").className = `status ${st} show`;
    $("status").textContent = st === "known"
      ? "이 문제에는 ‘알겠어요’로 표시되어 있습니다."
      : "이 문제에는 ‘한 번 더 보기’로 표시되어 있습니다.";
    $("status").style.display = "block";
  }

  $("roundEnd").classList.remove("show", "complete");
  renderSegments();
  renderCounts();
  save();
  window.scrollTo({top:0, behavior:"smooth"});
}

function finishRound(){
  session.ended = true;
  const retry = QUESTIONS.filter(q => states[q.number] !== "known").map(q => q.number);

  // 완료/회차 종료 화면에서는 마지막 문제 카드가 남아 보이지 않도록 숨깁니다.
  $("questionCard").style.display = "none";
  $("flipWrap").style.display = "none";
  $("actions").classList.remove("show");
  $("actions").style.display = "none";
  $("status").style.display = "none";
  $("navArea").style.display = "none";
  $("roundEnd").classList.add("show");

  if(retry.length === 0){
    $("roundEnd").classList.add("complete");
    $("roundEndIcon").textContent = "✓";
    $("roundEndTitle").textContent = "🎉 모든 문제를 완료했습니다!";
    const roundText = session.round === 1
      ? "총 1바퀴 만에 완료하셨습니다. 🎉"
      : `총 ${session.round}바퀴 반복하여 완료하셨습니다. 👍`;

    $("roundEndText").innerHTML =
      "훌륭합니다, 선생님!<br>" +
      "모든 예상질문을 ‘알겠어요’로 완료하셨습니다.<br>" +
      `<strong>${roundText}</strong><br><br>` +
      "지금처럼 가끔씩 반복해서 연습하시면<br>" +
      "평가 면담도 자신 있게 하실 수 있습니다.<br><br>" +
      "수고하셨습니다. 😊<br>" +
      "<strong>원주연세재가복지센터</strong>";
    $("roundNextBtn").style.display = "none";
    $("restartBtn").style.display = "block";
    $("kakaoShareBtn").style.display = "block";
    $("counter").textContent = "모두 완료";
  } else {
    $("roundEnd").classList.remove("complete");
    $("roundEndIcon").textContent = "↻";
    $("roundEndTitle").textContent = `${session.round}바퀴를 마쳤습니다.`;
    $("roundEndText").innerHTML = `다시 볼 문제가 <strong>${retry.length}개</strong> 있습니다.<br>알겠어요가 될 때까지 다시 확인해 보세요.`;
    $("roundNextBtn").style.display = "block";
    $("restartBtn").style.display = "none";
    $("kakaoShareBtn").style.display = "none";
    $("counter").textContent = `다시 볼 문제 ${retry.length}`;
  }

  renderSegments();
  renderCounts();
  save();
  window.scrollTo({top:0, behavior:"smooth"});
}

function prepareForQuestionChange(){
  // 뒤집힌 답변 면을 즉시 앞면으로 되돌린 뒤 다음 문항을 그려
  // 다음 문제의 답이 회전 도중 순간적으로 비치는 현상을 막습니다.
  const card = $("flipCard");
  card.classList.add("no-transition");
  card.classList.remove("flipped");
  card.style.height = "152px";
  $("actions").classList.remove("show");
  requestAnimationFrame(() => {
    requestAnimationFrame(() => card.classList.remove("no-transition"));
  });
}

function markState(state){
  const q = currentQuestion();
  states[q.number] = state;
  save();
  renderSegments();
  renderCounts();

  // 다음 문제로 넘어가기 전에 답변 면을 먼저 완전히 숨깁니다.
  prepareForQuestionChange();

  if(session.position === session.queue.length - 1){
    setTimeout(finishRound, 120);
  } else {
    setTimeout(() => {
      session.position++;
      renderQuestion();
    }, 120);
  }
}

$("showAnswer").onclick = () => {
  $("flipCard").style.height = `${Math.max(152, $("answerCard").scrollHeight)}px`;
  $("flipCard").classList.add("flipped");
  $("actions").classList.add("show");
};

function hideAnswer(){
  $("flipCard").classList.remove("flipped");
  $("flipCard").style.height = "152px";
  $("actions").classList.remove("show");
}

$("answerCard").onclick = hideAnswer;
$("answerCard").onkeydown = (e) => {
  if(e.key === "Enter" || e.key === " "){
    e.preventDefault();
    hideAnswer();
  }
};

$("knownBtn").onclick = () => markState("known");
$("reviewBtn").onclick = () => markState("review");

$("prevBtn").onclick = () => {
  if(session.position > 0){ session.position--; renderQuestion(); }
};
$("nextBtn").onclick = () => {
  if(session.position < session.queue.length - 1){ session.position++; renderQuestion(); }
};

$("roundNextBtn").onclick = () => {
  const retry = QUESTIONS.filter(q => states[q.number] !== "known").map(q => q.number);
  if(!retry.length){ finishRound(); return; }
  session.round += 1;
  session.queue = retry;
  session.position = 0;
  session.ended = false;
  hideRoundEnd();
  renderQuestion();
};

$("restartBtn").onclick = () => {
  states = {};
  session = {round:1, queue:QUESTIONS.map(q=>q.number), position:0, ended:false};
  save();
  setFontSize(false);
  hideRoundEnd();
  $("introScreen").style.display = "none";
  $("studyScreen").style.display = "block";
  renderQuestion();
};

$("startBtn").onclick = () => {
  setFontSize(false);
  $("introScreen").style.display = "none";
  $("studyScreen").style.display = "block";
  if(session.ended) finishRound();
  else renderQuestion();
};

$("resetBtn").onclick = () => {
  if(confirm("표시해 둔 학습 진행기록을 모두 지우고 처음부터 시작할까요?")){
    states = {};
    session = {round:1, queue:QUESTIONS.map(q=>q.number), position:0, ended:false};
    save();
    hideRoundEnd();
    renderQuestion();
  }
};


function formatCompletionTime(date){
  const yy = String(date.getFullYear()).slice(-2);
  const month = date.getMonth() + 1;
  const day = date.getDate();
  const hour24 = date.getHours();
  const ampm = hour24 < 12 ? "오전" : "오후";
  const hour12 = hour24 % 12 || 12;
  const minute = String(date.getMinutes()).padStart(2, "0");
  return `${yy}년 ${month}월 ${day}일 ${ampm} ${hour12}:${minute}`;
}

function buildShareText(){
  const roundText = session.round === 1
    ? "총 1바퀴 만에 완료했습니다. 🎉"
    : `총 ${session.round}바퀴 반복하여 완료했습니다. 👍`;

  return [
    "🎉 평가 면담 예상질문 학습을 모두 완료했습니다!",
    `${QUESTIONS.length}문항 모두 ‘알겠어요’ 완료했습니다.`,
    "",
    roundText,
    "",
    `완료 일시: ${formatCompletionTime(new Date())}`,
    "원주연세재가복지센터"
  ].join("\n");
}

function initKakaoShare(){
  if(!KAKAO_JAVASCRIPT_KEY) return false;
  if(typeof Kakao === "undefined") return false;
  try{
    if(!Kakao.isInitialized()) Kakao.init(KAKAO_JAVASCRIPT_KEY);
    return Kakao.isInitialized();
  }catch(e){
    console.error(e);
    return false;
  }
}

$("kakaoShareBtn").onclick = () => {
  const ok = confirm("카톡으로 문제를 완료했음을 담당 사회복지사에게 자랑하세요! 답장은 오지 않을 수 있습니다^^;");
  if(!ok) return;

  if(!initKakaoShare()){
    alert("카카오톡 직접 공유를 위한 1회 설정이 아직 필요합니다. 카카오 JavaScript 키를 연결한 뒤 사용할 수 있습니다.");
    return;
  }

  Kakao.Share.sendDefault({
    objectType: "text",
    text: buildShareText(),
    link: {
      mobileWebUrl: "https://minsu74v.github.io/yonseicare-school/",
      webUrl: "https://minsu74v.github.io/yonseicare-school/"
    },
    buttonTitle: "학습 사이트 열기"
  });
};

function setFontSize(isLarge){
  largeFont = isLarge;
  document.documentElement.classList.toggle("large-text", largeFont);
  $("fontLabel").textContent = largeFont ? "글자 작게" : "글자 크게";
  document.querySelector(".font-icon").textContent = largeFont ? "가-" : "가+";
  if($("flipCard").classList.contains("flipped")){
    requestAnimationFrame(() => $("flipCard").style.height = `${$("answerCard").scrollHeight}px`);
  }
}

$("fontBtn").onclick = () => setFontSize(!largeFont);
setFontSize(false);


renderSegments();
renderCounts();
if(session.ended){
  $("counter").textContent = "모두 완료";
} else if(session.round === 1){
  $("counter").textContent = `${QUESTIONS.length} 중 ${session.position + 1}`;
} else {
  $("counter").textContent = `다시보기 ${session.position + 1} / ${session.queue.length}`;
}
$("introScreen").style.display = "block";
$("studyScreen").style.display = "none";
</script>
</body>
</html>
