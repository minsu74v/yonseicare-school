<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>원주연세재가복지센터 | 평가 면담 준비</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand">원주연세재가복지센터</div>
    <div class="title-row">
      <h1>평가 면담 준비</h1>
      <div class="counter" id="counter">32 중 1</div>
    </div>
    <div class="segment-bar" id="segmentBar" aria-label="문항 진행 상태"></div>
    <div class="legend">
      <span><i class="dot"></i>아직 안 봄</span>
      <span><i class="dot known"></i>알겠어요</span>
      <span><i class="dot review"></i>한 번 더 보기</span>
    </div>
  </header>

  <main>
    <div class="category" id="category"></div>
    <div class="question-number" id="qNo"></div>
    <h2 class="question" id="question"></h2>

    <div class="think-card" id="thinkCard">
      <div class="think-title">먼저 내 말로 한번 생각해 보세요.</div>
      <div class="think-sub">완벽하게 외우기보다 핵심 내용을 기억하는 것이 중요합니다.</div>
    </div>

    <button class="primary" id="showAnswer">답 확인하기</button>

    <section class="answer-card" id="answerCard">
      <div class="answer-label">이렇게 말씀하시면 됩니다</div>
      <div class="answer" id="answer"></div>
    </section>

    <div class="actions" id="actions">
      <button class="action known-btn" id="knownBtn">✓ 알겠어요</button>
      <button class="action review-btn" id="reviewBtn">↻ 한 번 더 볼래요</button>
    </div>

    <div class="status" id="status"></div>

    <div class="nav">
      <button id="prevBtn">← 이전 문제</button>
      <button id="nextBtn">다음 문제 →</button>
    </div>

    <div class="tools">
      <button class="toolbtn" id="fontBtn">가+ 글자 크게</button>
      <button class="toolbtn" id="resetBtn">진행기록 초기화</button>
    </div>

    <div class="summary" id="summary"></div>
  </main>
</div>

<script src="questions.js"></script>
<script>
const STORAGE_KEY = "yonseicare-school-progress-v1";
let current = Number(localStorage.getItem("yonseicare-current") || 0);
if (current < 0 || current >= QUESTIONS.length) current = 0;
let states = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
let largeFont = localStorage.getItem("yonseicare-large-font") === "1";

const $ = (id) => document.getElementById(id);

function escapeHtml(text){
  return String(text).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[ch]));
}
function highlightText(text, words){
  if(!words || !words.length) return escapeHtml(text);
  const sorted = [...words].sort((a,b)=>b.length-a.length);
  const pattern = sorted.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  const re = new RegExp("(" + pattern + ")", "g");
  return escapeHtml(text).replace(re, '<span class="blue">$1</span>');
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(states));
  localStorage.setItem("yonseicare-current", current);
}
function renderSegments(){
  const bar = $("segmentBar");
  bar.innerHTML = "";
  QUESTIONS.forEach((q,i)=>{
    const s=document.createElement("div");
    s.className="segment";
    if(states[q.number]==="known") s.classList.add("known");
    if(states[q.number]==="review") s.classList.add("review");
    if(i===current) s.classList.add("current");
    bar.appendChild(s);
  });
}
function renderSummary(){
  const known = Object.values(states).filter(v=>v==="known").length;
  const review = Object.values(states).filter(v=>v==="review").length;
  $("summary").textContent = `알겠어요 ${known}개 · 한 번 더 보기 ${review}개 · 아직 안 본 문제 ${QUESTIONS.length-known-review}개`;
}
function render(){
  const q=QUESTIONS[current];
  $("counter").textContent=`${QUESTIONS.length} 중 ${current+1}`;
  $("category").textContent=q.category;
  $("qNo").textContent=`문제 ${current+1}`;
  $("question").innerHTML=highlightText(q.question,q.qHighlights);
  $("answer").innerHTML=highlightText(q.answer,q.highlights);
  $("answerCard").classList.remove("show");
  $("actions").classList.remove("show");
  $("showAnswer").style.display="block";
  $("thinkCard").style.display="block";
  $("status").className="status";
  $("prevBtn").disabled=current===0;
  $("nextBtn").disabled=current===QUESTIONS.length-1;
  if(states[q.number]){
    const st=states[q.number];
    $("status").className=`status show ${st}`;
    $("status").textContent=st==="known" ? "이 문제는 ‘알겠어요’로 표시되어 있습니다." : "이 문제는 ‘한 번 더 보기’로 표시되어 있습니다.";
  }
  renderSegments(); renderSummary(); save();
}
$("showAnswer").onclick=()=>{
  $("answerCard").classList.add("show");
  $("actions").classList.add("show");
  $("showAnswer").style.display="none";
  $("thinkCard").style.display="none";
};
$("knownBtn").onclick=()=>{
  states[QUESTIONS[current].number]="known"; save(); renderSegments(); renderSummary();
  $("status").className="status show known"; $("status").textContent="좋아요. ‘알겠어요’로 표시했습니다.";
  if(current<QUESTIONS.length-1){ setTimeout(()=>{current++;render();window.scrollTo(0,0)},350); }
};
$("reviewBtn").onclick=()=>{
  states[QUESTIONS[current].number]="review"; save(); renderSegments(); renderSummary();
  $("status").className="status show review"; $("status").textContent="‘한 번 더 보기’로 표시했습니다.";
  if(current<QUESTIONS.length-1){ setTimeout(()=>{current++;render();window.scrollTo(0,0)},350); }
};
$("prevBtn").onclick=()=>{if(current>0){current--;render();window.scrollTo(0,0)}};
$("nextBtn").onclick=()=>{if(current<QUESTIONS.length-1){current++;render();window.scrollTo(0,0)}};
$("resetBtn").onclick=()=>{
  if(confirm("표시해 둔 학습 진행기록을 모두 지울까요?")){
    states={}; current=0; save(); render();
  }
};
$("fontBtn").onclick=()=>{
  largeFont=!largeFont;
  localStorage.setItem("yonseicare-large-font",largeFont?"1":"0");
  document.documentElement.style.fontSize=largeFont?"21px":"18px";
  $("fontBtn").textContent=largeFont?"가− 기본 글자":"가+ 글자 크게";
};
if(largeFont){
  document.documentElement.style.fontSize="21px";
  $("fontBtn").textContent="가− 기본 글자";
}
render();
</script>
</body>
</html>
