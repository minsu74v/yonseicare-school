<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>원주연세재가복지센터 | 평가 면담 준비</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand">원주연세재가복지센터</div>
    <div class="title-row">
      <h1>평가 면담 준비</h1>
      <div class="counter" id="counter">32 중 1</div>
    </div>

    <div class="segment-bar" id="segmentBar" aria-label="문항 진행 상태"></div>

    <div class="state-counts" aria-label="문항 상태 요약">
      <div class="state-item unseen"><span class="dot"></span><span>아직 안 봄</span><strong id="unseenCount">32</strong></div>
      <div class="state-item known"><span class="dot known"></span><span>알겠어요</span><strong id="knownCount">0</strong></div>
      <div class="state-item review"><span class="dot review"></span><span>한 번 더 보기</span><strong id="reviewCount">0</strong></div>
    </div>
  </header>

  <main>
    <section class="intro-screen" id="introScreen">
      <div class="intro-hello">안녕하세요 선생님!</div>
      <div class="intro-text">
        평가 시 공단직원이 선생님께 직접 할 수 있는<br>
        <strong>예상질문 연습</strong>입니다.<br><br>
        주기적인 반복학습을 해주시면 큰 도움이 됩니다.
      </div>
      <div class="intro-center">원주연세재가복지센터</div>
      <button class="start-btn" id="startBtn" type="button">학습 시작하기</button>
      <div class="copyright-note">
        본 학습자료 및 사이트의 저작권은 원주연세재가복지센터에 있습니다.<br>
        허가 없는 복제·배포·수정·재사용 및 영리적 이용을 금하며,<br>
        위반 시 관련 법령에 따른 책임이 발생할 수 있습니다.
      </div>
    </section>

    <div id="studyScreen" style="display:none">
    <section class="question-card">
      <div class="question-meta">
        <span class="question-number" id="qNo">문제 1</span>
        <span class="category" id="category"></span>
      </div>
      <h2 class="question" id="question"></h2>
    </section>

    <div class="flip-wrap" id="flipWrap">
      <div class="flip-card" id="flipCard">
        <button class="flip-face flip-front" id="showAnswer" type="button" aria-label="답 확인하기">
          <span class="answer-icon">↻</span>
          <span>답 확인하기</span>
        </button>

        <section class="flip-face flip-back answer-card" id="answerCard" aria-live="polite">
          <div class="answer-label"><span class="answer-badge">A</span><span>답변</span></div>
          <div class="answer" id="answer"></div>
        </section>
      </div>
    </div>

    <div class="actions" id="actions">
      <button class="action known-btn" id="knownBtn">✓ 알겠어요</button>
      <button class="action review-btn" id="reviewBtn">↻ 한 번 더 볼래요</button>
    </div>

    <div class="status" id="status"></div>

    <section class="round-end" id="roundEnd">
      <div class="round-end-icon" id="roundEndIcon">↻</div>
      <div class="round-end-title" id="roundEndTitle"></div>
      <div class="round-end-text" id="roundEndText"></div>
      <button class="round-next-btn" id="roundNextBtn">다시 볼 문제로 가기</button>
      <button class="restart-btn" id="restartBtn" type="button">처음부터 다시 하기</button>
    </section>

    <div class="nav" id="navArea">
      <button id="prevBtn">← 이전 문제</button>
      <button id="nextBtn">다음 문제 →</button>
    </div>

    <div class="tools">
      <button class="toolbtn" id="fontBtn">가+ 글자 크게</button>
      <button class="toolbtn" id="resetBtn">진행기록 초기화</button>
    </div>
    </div>
  </main>
</div>

<script src="questions.js"></script>
<script>
const STORAGE_KEY = "yonseicare-school-progress-v2";
const SESSION_KEY = "yonseicare-school-session-v2";
let states = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
let largeFont = localStorage.getItem("yonseicare-large-font") === "1";

let session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
if (!session || !Array.isArray(session.queue) || session.queue.some(n => !QUESTIONS.some(q => q.number === n))) {
  session = {
    round: 1,
    queue: QUESTIONS.map(q => q.number),
    position: 0,
    ended: false
  };
}
if (session.position < 0 || session.position >= session.queue.length) session.position = 0;

const $ = (id) => document.getElementById(id);

function escapeHtml(text){
  return String(text).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[ch]));
}

function highlightText(text, words){
  if(!words || !words.length) return escapeHtml(text);
  const sorted = [...words].sort((a,b)=>b.length-a.length);
  const pattern = sorted.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  const re = new RegExp("(" + pattern + ")", "g");
  return escapeHtml(text).replace(re, '<span class="blue">$1</span>');
}

function formatAnswer(text){
  return String(text)
    .replace(/,\s*/g, ",\n")
    .replace(/\.\s+(?=[가-힣A-Za-z0-9])/g, ".\n");
}

function currentQuestion(){
  const number = session.queue[session.position];
  return QUESTIONS.find(q => q.number === number);
}

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(states));
  localStorage.setItem(SESSION_KEY, JSON.stringify(session));
}

function renderSegments(){
  const bar = $("segmentBar");
  bar.innerHTML = "";
  bar.style.gridTemplateColumns = `repeat(${QUESTIONS.length}, 1fr)`;
  const currentNo = session.ended ? null : currentQuestion().number;
  QUESTIONS.forEach(q => {
    const s = document.createElement("div");
    s.className = "segment";
    if(states[q.number] === "known") s.classList.add("known");
    if(states[q.number] === "review") s.classList.add("review");
    if(q.number === currentNo) s.classList.add("current");
    bar.appendChild(s);
  });
}

function renderCounts(){
  const known = QUESTIONS.filter(q => states[q.number] === "known").length;
  const review = QUESTIONS.filter(q => states[q.number] === "review").length;
  const unseen = QUESTIONS.length - known - review;
  $("knownCount").textContent = known;
  $("reviewCount").textContent = review;
  $("unseenCount").textContent = unseen;
}

function hideRoundEnd(){
  $("roundEnd").classList.remove("show", "complete");
  $("navArea").style.display = "grid";
  $("flipWrap").style.display = "block";
  $("actions").style.display = "grid";
  $("status").style.display = "";
}

function renderQuestion(){
  session.ended = false;
  const q = currentQuestion();

  $("counter").textContent = session.round === 1
    ? `${QUESTIONS.length} 중 ${session.position + 1}`
    : `다시보기 ${session.position + 1} / ${session.queue.length}`;
  $("qNo").textContent = `문제 ${q.number}`;
  $("category").textContent = q.category;
  $("question").innerHTML = highlightText(q.question, q.qHighlights);
  $("answer").innerHTML = highlightText(formatAnswer(q.answer), q.highlights);

  $("flipCard").classList.remove("flipped");
  $("flipCard").style.height = "152px";
  $("actions").classList.remove("show");
  $("status").className = "status";
  $("status").style.display = "none";
  $("flipWrap").style.display = "block";
  $("navArea").style.display = "grid";

  $("prevBtn").disabled = session.position === 0;
  $("nextBtn").disabled = session.position === session.queue.length - 1;

  if(states[q.number]){
    const st = states[q.number];
    $("status").className = `status ${st}`;
    $("status").textContent = st === "known"
      ? "이 문제는 ‘알겠어요’로 표시되어 있습니다."
      : "이 문제는 ‘한 번 더 보기’로 표시되어 있습니다.";
  }

  $("roundEnd").classList.remove("show", "complete");
  renderSegments();
  renderCounts();
  save();
  window.scrollTo({top:0, behavior:"smooth"});
}

function finishRound(){
  session.ended = true;
  const retry = QUESTIONS.filter(q => states[q.number] !== "known").map(q => q.number);

  $("flipWrap").style.display = "none";
  $("actions").classList.remove("show");
  $("actions").style.display = "none";
  $("status").style.display = "none";
  $("navArea").style.display = "none";
  $("roundEnd").classList.add("show");

  if(retry.length === 0){
    $("roundEnd").classList.add("complete");
    $("roundEndIcon").textContent = "✓";
    $("roundEndTitle").textContent = "훌륭합니다!";
    $("roundEndText").innerHTML = "모든 문제를 알고 계시는군요!<br>주기적인 반복학습을 권장드립니다.";
    $("roundNextBtn").style.display = "none";
    $("restartBtn").style.display = "block";
    $("counter").textContent = "모두 완료";
  } else {
    $("roundEndIcon").textContent = "↻";
    $("roundEndTitle").textContent = `${session.round}바퀴를 마쳤습니다.`;
    $("roundEndText").innerHTML = `다시 볼 문제가 <strong>${retry.length}개</strong> 있습니다.<br>알겠어요가 될 때까지 다시 확인해 보세요.`;
    $("roundNextBtn").style.display = "block";
    $("restartBtn").style.display = "none";
    $("counter").textContent = `다시 볼 문제 ${retry.length}`;
  }

  renderSegments();
  renderCounts();
  save();
  window.scrollTo({top:0, behavior:"smooth"});
}

function markState(state){
  const q = currentQuestion();
  states[q.number] = state;
  save();
  renderSegments();
  renderCounts();

  if(session.position === session.queue.length - 1){
    setTimeout(finishRound, 220);
  } else {
    setTimeout(() => {
      session.position++;
      renderQuestion();
    }, 260);
  }
}

$("showAnswer").onclick = () => {
  $("flipCard").style.height = `${Math.max(152, $("answerCard").scrollHeight)}px`;
  $("flipCard").classList.add("flipped");
  $("actions").classList.add("show");
  const q = currentQuestion();
  if(states[q.number]){
    $("status").classList.add("show");
    $("status").style.display = "block";
  }
};

$("knownBtn").onclick = () => markState("known");
$("reviewBtn").onclick = () => markState("review");

$("prevBtn").onclick = () => {
  if(session.position > 0){ session.position--; renderQuestion(); }
};
$("nextBtn").onclick = () => {
  if(session.position < session.queue.length - 1){ session.position++; renderQuestion(); }
};

$("roundNextBtn").onclick = () => {
  const retry = QUESTIONS.filter(q => states[q.number] !== "known").map(q => q.number);
  if(!retry.length){ finishRound(); return; }
  session.round += 1;
  session.queue = retry;
  session.position = 0;
  session.ended = false;
  hideRoundEnd();
  renderQuestion();
};

$("restartBtn").onclick = () => {
  states = {};
  session = {round:1, queue:QUESTIONS.map(q=>q.number), position:0, ended:false};
  save();
  hideRoundEnd();
  $("introScreen").style.display = "none";
  $("studyScreen").style.display = "block";
  renderQuestion();
};

$("startBtn").onclick = () => {
  $("introScreen").style.display = "none";
  $("studyScreen").style.display = "block";
  if(session.ended) finishRound();
  else renderQuestion();
};

$("resetBtn").onclick = () => {
  if(confirm("표시해 둔 학습 진행기록을 모두 지우고 처음부터 시작할까요?")){
    states = {};
    session = {round:1, queue:QUESTIONS.map(q=>q.number), position:0, ended:false};
    save();
    hideRoundEnd();
    renderQuestion();
  }
};

$("fontBtn").onclick = () => {
  largeFont = !largeFont;
  localStorage.setItem("yonseicare-large-font", largeFont ? "1" : "0");
  document.documentElement.style.fontSize = largeFont ? "21px" : "18px";
  $("fontBtn").textContent = largeFont ? "가− 기본 글자" : "가+ 글자 크게";
  if($("flipCard").classList.contains("flipped")){
    requestAnimationFrame(() => $("flipCard").style.height = `${$("answerCard").scrollHeight}px`);
  }
};

if(largeFont){
  document.documentElement.style.fontSize = "21px";
  $("fontBtn").textContent = "가− 기본 글자";
}

renderSegments();
renderCounts();
if(session.ended){
  $("counter").textContent = "모두 완료";
} else if(session.round === 1){
  $("counter").textContent = `${QUESTIONS.length} 중 ${session.position + 1}`;
} else {
  $("counter").textContent = `다시보기 ${session.position + 1} / ${session.queue.length}`;
}
$("introScreen").style.display = "block";
$("studyScreen").style.display = "none";
</script>
</body>
</html>
